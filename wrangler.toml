name = "ssq-oracle"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"
 
 # 自定义域名：绑定到自有 zone，国内可直连（workers.dev 被墙）
 # 部署时 Cloudflare 会自动在 jeasonloop.online zone 下创建该 DNS 记录
 routes = [
   { pattern = "ssq-predict.jeasonloop.online", custom_domain = true }
 ]
 
 # 显式关闭 workers.dev 子域（已被墙，避免误用）
 workers_dev = false

# 前端静态资源：vite build 产物由 Worker 托管
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# 构建命令：部署时自动执行（CI 与本地 wrangler deploy 通用）
[build]
command = "npm run build"
